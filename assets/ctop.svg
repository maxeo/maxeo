<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 600" role="img" aria-label="ctop: metriche dei container nel terminale, con le barre della CPU che si muovono">
<defs>
<linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14121c"/><stop offset="1" stop-color="#211c2e"/></linearGradient>
<linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241f33"/><stop offset="1" stop-color="#1a1725"/></linearGradient>
</defs>
<style>
.t1{font:500 54px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;fill:#f1ece3}
.t2{font:400 24px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#e9a65b}
.h{font:700 19px ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:#e9a65b}
.r{font:400 21px ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:#f1ece3}
.m{font:400 21px ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:#a8a1b8}
.bar{transform-box:fill-box;transform-origin:0 50%;animation:c 3.2s ease-in-out infinite alternate}
@keyframes c{0%{transform:scaleX(var(--a))}50%{transform:scaleX(var(--b))}100%{transform:scaleX(var(--c))}}
.cur{animation:k 1.1s steps(1) infinite}
@keyframes k{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.bar,.cur{animation:none}.bar{transform:scaleX(var(--b))}}
</style>
<rect width="944" height="600" fill="url(#f)"/>
<text class="t1" x="72" y="92">ctop</text>
<text class="t2" x="72" y="130">Metriche dei container nel terminale</text>
<circle cx="836" cy="96" r="54" fill="none" stroke="#e9a65b" stroke-width="2"/>
<path d="M812 80l18 16-18 16" fill="none" stroke="#e9a65b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="cur" x="836" y="106" width="26" height="7" rx="3" fill="#e9a65b"/>
<rect x="72" y="176" width="800" height="356" rx="22" fill="url(#s)" stroke="#3a3350" stroke-width="2"/>
<text class="h" x="104" y="222">  NAME</text><text class="h" x="340" y="222">CPU</text><text class="h" x="640" y="222">MEM</text><text class="h" x="760" y="222">PIDS</text>
<line x1="104" y1="236" x2="840" y2="236" stroke="#3a3350" stroke-width="2"/>
<g>
<circle cx="112" cy="267" r="6" fill="#3fb68b"/><text class="r" x="130" y="274">homeassistant</text>
<rect x="340" y="258" width="270" height="18" rx="3" fill="#2f2942"/><rect class="bar" x="340" y="258" width="270" height="18" rx="3" fill="#3fb68b" style="--a:.32;--b:.58;--c:.41;animation-delay:-.4s"/>
<text class="m" x="640" y="274">612M</text><text class="m" x="760" y="274">48</text>

<circle cx="112" cy="313" r="6" fill="#3fb68b"/><text class="r" x="130" y="320">postgres</text>
<rect x="340" y="304" width="270" height="18" rx="3" fill="#2f2942"/><rect class="bar" x="340" y="304" width="270" height="18" rx="3" fill="#3fb68b" style="--a:.12;--b:.22;--c:.08;animation-delay:-1.3s"/>
<text class="m" x="640" y="320">184M</text><text class="m" x="760" y="320">9</text>

<circle cx="112" cy="359" r="6" fill="#3fb68b"/><text class="r" x="130" y="366">nginx</text>
<rect x="340" y="350" width="270" height="18" rx="3" fill="#2f2942"/><rect class="bar" x="340" y="350" width="270" height="18" rx="3" fill="#3fb68b" style="--a:.05;--b:.14;--c:.06;animation-delay:-2.1s"/>
<text class="m" x="640" y="366">22M</text><text class="m" x="760" y="366">5</text>

<circle cx="112" cy="405" r="6" fill="#3fb68b"/><text class="r" x="130" y="412">grafana</text>
<rect x="340" y="396" width="270" height="18" rx="3" fill="#2f2942"/><rect class="bar" x="340" y="396" width="270" height="18" rx="3" fill="#e9a65b" style="--a:.46;--b:.78;--c:.6;animation-delay:-.9s"/>
<text class="m" x="640" y="412">243M</text><text class="m" x="760" y="412">17</text>

<circle cx="112" cy="451" r="6" fill="#3fb68b"/><text class="r" x="130" y="458">redis</text>
<rect x="340" y="442" width="270" height="18" rx="3" fill="#2f2942"/><rect class="bar" x="340" y="442" width="270" height="18" rx="3" fill="#3fb68b" style="--a:.09;--b:.04;--c:.15;animation-delay:-2.7s"/>
<text class="m" x="640" y="458">31M</text><text class="m" x="760" y="458">6</text>

<circle cx="112" cy="497" r="6" fill="#6b6478"/><text class="m" x="130" y="504">backup</text>
<rect x="340" y="488" width="270" height="18" rx="3" fill="#2f2942"/>
<text class="m" x="640" y="504">-</text><text class="m" x="760" y="504">-</text>
</g>
</svg>
