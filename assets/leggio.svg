<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 600" role="img" aria-label="Leggio: lettore di audiolibri con il testo che segue la voce">
<defs>
<linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14121c"/><stop offset="1" stop-color="#211c2e"/></linearGradient>
<linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241f33"/><stop offset="1" stop-color="#1a1725"/></linearGradient>
</defs>
<style>
.t1{font:500 54px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;fill:#f1ece3}
.t2{font:400 24px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#e9a65b}
.v{font:400 34px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;fill:#f1ece3}
.g{opacity:.2}
.q{opacity:.5;animation:w 5.4s linear infinite}
@keyframes w{0%,7%{fill:#e9a65b;opacity:1}16%,100%{fill:#f1ece3;opacity:.5}}
.pb{animation:p 5.4s linear infinite}
@keyframes p{from{width:40px}to{width:600px}}
.pt{animation:d 5.4s linear infinite}
@keyframes d{from{transform:translateX(40px)}to{transform:translateX(600px)}}
.on{animation:o 1.8s ease-in-out infinite alternate}
@keyframes o{from{opacity:.25}to{opacity:.9}}
@media (prefers-reduced-motion:reduce){.q,.pb,.pt,.on{animation:none}.q{opacity:.5}.pb{width:320px}.pt{transform:translateX(320px)}}
</style>
<rect width="944" height="600" fill="url(#f)"/>
<text class="t1" x="72" y="92">Leggio</text>
<text class="t2" x="72" y="130">Audiolibri con il testo che segue la voce</text>
<circle class="on" cx="836" cy="96" r="54" fill="none" stroke="#e9a65b" stroke-width="2"/>
<g fill="none" stroke="#e9a65b" stroke-width="7" stroke-linecap="round"><path d="M812 100V92a24 24 0 0 1 48 0v8"/></g>
<rect x="806" y="98" width="13" height="26" rx="6.5" fill="#e9a65b"/><rect x="853" y="98" width="13" height="26" rx="6.5" fill="#e9a65b"/>
<rect x="72" y="176" width="800" height="356" rx="22" fill="url(#s)" stroke="#3a3350" stroke-width="2"/>
<text class="v" x="116" y="248" fill="#e9a65b" opacity=".75">2. Nella selva oscura</text>
<text class="v" x="116" y="316">
<tspan class="q" style="animation-delay:0s">Nel</tspan>
<tspan class="q" style="animation-delay:.6s"> mezzo</tspan>
<tspan class="q" style="animation-delay:1.2s"> del</tspan>
<tspan class="q" style="animation-delay:1.8s"> cammin</tspan>
<tspan class="q" style="animation-delay:2.4s"> di</tspan>
<tspan class="q" style="animation-delay:3s"> nostra</tspan>
<tspan class="q" style="animation-delay:3.6s"> vita</tspan>
</text>
<text class="v g" x="116" y="366">mi ritrovai per una selva oscura,</text>
<text class="v g" x="116" y="416">ché la diritta via era smarrita.</text>
<rect x="116" y="470" width="712" height="6" rx="3" fill="#3a3350"/>
<rect class="pb" x="116" y="470" height="6" rx="3" fill="#e9a65b"/>
<circle class="pt" cx="116" cy="473" r="9" fill="#e9a65b"/>
<g fill="#f1ece3" opacity=".55">
<path d="M140 496l-18 14 18 14zM162 496l-18 14 18 14z"/>
<path d="M404 494a22 22 0 1 1 0 44 22 22 0 0 1 0-44zm-6 11v22l18-11z"/>
<rect x="668" y="498" width="4" height="36" rx="2"/><rect x="680" y="506" width="4" height="20" rx="2"/><rect x="692" y="492" width="4" height="48" rx="2"/><rect x="704" y="504" width="4" height="24" rx="2"/><rect x="716" y="498" width="4" height="36" rx="2"/>
</g>
</svg>
